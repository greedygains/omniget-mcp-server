[package]
name = "omniget-server"
version = "0.1.0"
edition = "2021"
description = "Standalone headless MCP & REST server for OmniGet"
authors = ["OmniGet Authors"]
publish = false

[lib]
name = "omniget_server"
path = "src/lib.rs"

[[bin]]
name = "omniget-server"
path = "src/main.rs"

[dependencies]
omniget-core = { path = "../omniget-core", default-features = false }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
constant_time_eq = "0.4"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls", "gzip", "brotli", "deflate"] }
htmd = "0.5"
lopdf = { version = "0.45", default-features = false, features = ["chrono"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
urlencoding = "2"
bytes = "1"
